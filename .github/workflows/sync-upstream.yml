name: Sync Upstream Cinnabar

on:
  schedule:
    # Vérification toutes les 6 heures
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-upstream:
    name: Check for Upstream Updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chill-project
        uses: actions/checkout@v4

      - name: Fetch latest upstream Cinnabar commit
        id: upstream
        run: |
          UPSTREAM_JSON=$(curl -s "https://api.github.com/repos/cinnabar-mc/cinnabar/commits/dev")
          UPSTREAM_SHA=$(echo "$UPSTREAM_JSON" | jq -r '.sha')
          UPSTREAM_MSG=$(echo "$UPSTREAM_JSON" | jq -r '.commit.message' | head -n 1)
          
          echo "Dernier commit Cinnabar upstream: $UPSTREAM_SHA"
          echo "Message: $UPSTREAM_MSG"
          
          echo "sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "msg=$UPSTREAM_MSG" >> $GITHUB_OUTPUT

      - name: Compare with last built commit
        id: compare
        run: |
          LAST_SHA=""
          if [ -f ".upstream_sha" ]; then
            LAST_SHA=$(cat .upstream_sha)
          fi
          
          echo "Dernier SHA compilé: $LAST_SHA"
          echo "Nouveau SHA: ${{ steps.upstream.outputs.sha }}"
          
          if [ "$LAST_SHA" != "${{ steps.upstream.outputs.sha }}" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Build & Release workflow
        if: steps.compare.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Nouvelle version détectée en amont ! Déclenchement de la compilation..."
          gh workflow run "build-and-release.yml" \
            -f cinnabar_ref="dev" \
            -f code_branch="main" \
            -f version_suffix="sync-${{ steps.upstream.outputs.sha }}"
          
          # Sauvegarder le SHA
          echo "${{ steps.upstream.outputs.sha }}" > .upstream_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream_sha
          git commit -m "chore: sync upstream cinnabar commit ${{ steps.upstream.outputs.sha }}" || exit 0
          git push
